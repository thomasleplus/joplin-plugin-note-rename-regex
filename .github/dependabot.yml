---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
      prefix-development: chore(dev-deps)
    ignore:
      # TypeScript 7 (native port) has no JS compiler API, which ts-loader needs.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      osv-scanner:
        patterns:
          - "google/osv-scanner-action*"
